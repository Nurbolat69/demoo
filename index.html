<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Спандияр Көбеев – ұлт ағартушысының өмір жолы | Интерактивті сандық музей</title>
  <meta name="description" content="Қазақстан Республикалық ғылыми конкурсына арналған интерактивті сандық музей: Спандияр Көбеевтің өмір жолы. 6 тарихи станция, архивтік деректер, аудио-сұхбаттар.">
  
  <!-- Premium Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Minimalist Master Header -->
  <header class="header">
    <div class="brand" onclick="window.location.reload()">
      <div class="brand-emblem">СК</div>
      <div class="brand-text">
        <h1 class="brand-title" id="brandTitle">Спандияр Көбеевтің өмір жолы арқылы Қазақстандағы тарихи өзгерістерді тану</h1>
      </div>
    </div>

    <div class="header-actions">
      <div class="lang-switch">
        <button class="lang-btn active" id="langKz">KZ</button>
        <button class="lang-btn" id="langRu">RU</button>
      </div>

      <button class="btn-journey" id="btnJourney">Өмір жолымен жүру →</button>
    </div>
  </header>

  <!-- World Viewport & Integrated Winding Road Canvas -->
  <main class="world-viewport">
    <div class="world-canvas" id="worldCanvas">
      
      <!-- Master Photorealistic Kazakh Landscape Backdrop -->
      <img src="assets/reference_landscape.jpg" alt="Спандияр Көбеев өмір жолының тарихи пейзажы" class="landscape-image" id="landscapeImage">
      <div class="landscape-vignette"></div>

      <!-- Integrated Organic Caravan Road SVG -->
      <svg class="road-svg-integrated" id="roadSvgIntegrated" xmlns="http://www.w3.org/2000/svg"></svg>

      <!-- 6 Organic Station Nodes Rendered Dynamically via js/app.js -->

    </div>
  </main>

  <!-- Full-Screen Museum Detail Archival Modal -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal-card">
      <div class="modal-hero" id="modalHero">
        <div class="modal-hero-overlay"></div>
        <button class="modal-close-btn" id="modalCloseBtn" aria-label="Жабу">×</button>
        <div class="modal-hero-content">
          <div class="modal-period-badge" id="modalPeriodBadge"></div>
          <h2 class="modal-title" id="modalTitle"></h2>
          <p class="modal-subtitle" id="modalSubtitle"></p>
        </div>
      </div>

      <div class="modal-body" id="modalBody">
        <!-- Station Content Rendered via js/app.js -->
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
